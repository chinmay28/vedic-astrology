<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1124">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Janma Kundali">
<title>Janma Kundali</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/180.png">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="bar" id="bar">
  <button class="icon-btn" id="back" hidden aria-label="Back">&#8592;</button>
  <img class="brand-logo" src="/icon.svg" alt="" aria-hidden="true">
  <div class="brand-text">
    <h1 id="title">Janma Kundali</h1>
    <span class="brand-version" id="version" aria-label="App version"></span>
  </div>
  <button class="icon-btn" id="bar-action" hidden></button>
  <button class="dev-btn" id="dev-badge" title="Built by CM Hegday &middot; 0x434d"
          aria-label="Show the developer badge">
    <img src="/dev-badge.png" alt="" aria-hidden="true">
  </button>
</header>

<main id="view" aria-live="polite"></main>

<nav class="tabbar" id="tabbar" hidden></nav>

<div class="toast" id="toast" hidden></div>
<div class="dev-flash" id="dev-flash" hidden>
  <div class="dev-flash__lockup">
    <img class="dev-flash__logo" src="/dev-badge-full.png"
         alt="Built by CM Hegday &mdash; 0x434d">
    <a class="dev-flash__handle" href="https://github.com/chinmay28"
       target="_blank" rel="noopener">github.com/chinmay28</a>
  </div>
</div>
<div class="overlay" id="overlay" hidden>
  <div class="spinner"></div>
  <p id="overlay-text">Working…</p>
</div>

<script src="/app.js"></script>
</body>
</html>
