[project]
name = "kundali-report"
# MAJOR.MINOR from kundali/version.py, patch = the commit count. Building
# from a checkout stamps the real number into the wheel metadata, which is
# where an install with no .git reads it back from at runtime.
dynamic = ["version"]
description = "Jyotish natal + Tajika varshaphala PDF report generator (Swiss Ephemeris, sidereal)"
requires-python = ">=3.10"
dependencies = [
    "pyswisseph>=2.10",
    "reportlab>=4.0",
    "cairosvg>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
kundali-report = "kundali.cli:main"
kundali-web = "kundali.webapp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "kundali.__version__"}

[tool.setuptools.packages.find]
include = ["kundali*"]

[tool.setuptools.package-data]
"kundali.webapp" = ["static/*"]
