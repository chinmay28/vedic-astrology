# Build and publish a GitHub release for the commit this runs on.
#
# The tag is computed, not typed: scripts/version.py renders YEAR.MONTH.PATCH
# with YEAR.MONTH = the month of HEAD's commit and PATCH = the commit count, so
# the full history matters (fetch-depth: 0 — a shallow checkout reports patch
# 0 and the run refuses to release it). Tags are that version with a `v`
# (v2026.11.42). The release body is the CHANGELOG.md section whose heading
# names the tag exactly, which the changelog's own rules require to exist
# before a tag is published.
#
# Three things start it: a tag, a push to main, and a manual dispatch. Only
# those — this job runs with contents: write and publishes under the
# repository's own name, so a branch listed here is a branch whose every push
# can cut a release. A push to main publishes only when the commit names its
# own version in CHANGELOG.md (see "Release notes" below); any other push to
# main is skipped.
#
# What a release carries:
#   kundali_report-<version>.tar.gz / -py3-none-any.whl   the package (CLI and
#        web app); `pip install` either. The installers build from git and do
#        not need these.
#   janma-kundali.apk   the Android app, under a name that never changes, so
#        .../releases/latest/download/janma-kundali.apk always works.
#   SHA256SUMS          all of the above.
name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the patch number is the commit count; shallow = 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # For the phone app. The runner image ships the Android SDK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compute version
        id: version
        run: |
          VERSION="$(python3 scripts/version.py)"
          PATCH="$(python3 scripts/version.py --patch)"
          DATE="$(python3 scripts/version.py --date)"
          TAG="v${VERSION}"
          if [ "${PATCH}" = "0" ]; then
            echo "patch is 0 — unstamped build, refusing to release" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "${TAG}" ]; then
            echo "tag ${GITHUB_REF_NAME} names a commit that builds ${TAG} — refusing to publish it" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "patch=${PATCH}" >> "$GITHUB_OUTPUT"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"

      # The changelog heading is the release gate: a branch push whose version
      # has no section is an ordinary commit, not a release, and is skipped —
      # so only a commit that names its own version in CHANGELOG.md publishes.
      # A tag or manual dispatch without the section is an error outright.
      - name: Release notes from CHANGELOG.md
        id: notes
        run: |
          awk -v tag="${{ steps.version.outputs.tag }}" '
            $0 == "## " tag { found = 1; next }
            /^## / && found { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            if [ "${GITHUB_REF_TYPE}" = "branch" ] && [ "${GITHUB_EVENT_NAME}" = "push" ]; then
              echo "no '## ${{ steps.version.outputs.tag }}' section in CHANGELOG.md — not a release commit, skipping"
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "CHANGELOG.md has no '## ${{ steps.version.outputs.tag }}' section — a tag the changelog does not name must not be published" >&2
            exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

      # Stamped explicitly, so the wheel's metadata is the release's version
      # however setuptools happens to run. A pure-Python wheel: pyswisseph,
      # reportlab and cairosvg come from PyPI at install time.
      - name: Build the package
        if: steps.notes.outputs.release == 'true'
        env:
          KUNDALI_VERSION_PATCH: ${{ steps.version.outputs.patch }}
          KUNDALI_VERSION_DATE: ${{ steps.version.outputs.date }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          python3 -m pip install --upgrade build
          python3 -m build --outdir dist .
          for f in "dist/kundali_report-${VERSION}.tar.gz" "dist/kundali_report-${VERSION}-py3-none-any.whl"; do
            [ -f "$f" ] || { echo "expected $f, found: $(ls dist)" >&2; exit 1; }
          done

      # The release key, so every release installs over the last one. Without
      # the secrets the APK falls back to this runner's debug key, which no
      # earlier release was signed with, so it warns instead of failing.
      - name: Release signing key
        if: steps.notes.outputs.release == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::no ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD secrets: the APK is signed with this runner's debug key and will not install over an earlier release"
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      # Janma Kundali for Android, stamped with this release's version.
      # Attached under a name that never changes, so
      # .../releases/latest/download/janma-kundali.apk is always the newest.
      - name: Build janma-kundali.apk
        if: steps.notes.outputs.release == 'true'
        working-directory: apps/android
        run: |
          ./gradlew --no-daemon :app:assembleRelease \
            -PappVersionName="${{ steps.version.outputs.tag }}" \
            -PappVersionCode="${{ steps.version.outputs.patch }}"
          apks=(app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -ne 1 ] || [ ! -f "${apks[0]}" ]; then
            echo "expected exactly one release APK, found: ${apks[*]}" >&2
            exit 1
          fi
          cp "${apks[0]}" ../../dist/janma-kundali.apk

      - name: Checksums
        if: steps.notes.outputs.release == 'true'
        run: (cd dist && sha256sum kundali_report-* janma-kundali.apk > SHA256SUMS)

      - name: Publish release
        if: steps.notes.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "${TAG}" --json tagName >/dev/null 2>&1; then
            echo "release ${TAG} already exists — nothing to publish"
            exit 0
          fi
          gh release create "${TAG}" \
            "dist/kundali_report-${VERSION}.tar.gz" \
            "dist/kundali_report-${VERSION}-py3-none-any.whl" \
            dist/janma-kundali.apk \
            dist/SHA256SUMS \
            --target "${GITHUB_SHA}" \
            --title "${TAG}" \
            --notes-file notes.md
