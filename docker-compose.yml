# kundali-web, isolated: the only writable state is the kundali-data volume.
#
#   docker compose up -d          start (builds on first run)
#   docker compose logs -f        follow the log
#   docker compose down           stop; the volume - and your charts - survive
#
# Data lives in the named volume, not in the container, so `docker compose
# down`, image rebuilds and upgrades never touch it. To keep the database on
# the host instead, replace the volume line with a bind mount:
#
#   volumes:
#     - /srv/kundali:/data       # then: sudo chown -R 10001:10001 /srv/kundali
#
# Where it listens is the one thing worth changing per host, so it comes from
# the environment (scripts/quickstart.sh writes a .env beside this file):
#
#   KUNDALI_BIND=0.0.0.0 KUNDALI_PORT=8777 docker compose up -d

name: kundali          # fixed project name, so the volume is kundali_kundali-data
                       # wherever the checkout happens to live

services:
  kundali-web:
    build:
      context: .
      args:
        # The version's patch number is the commit count, and .git is not in
        # the build context - so it is passed in (quickstart.sh writes it to
        # the .env beside this file). Empty means "this build cannot tell",
        # which shows up as patch 0 rather than a wrong number.
        KUNDALI_VERSION_PATCH: "${KUNDALI_VERSION_PATCH:-}"
    image: kundali-web:local
    container_name: kundali-web
    restart: unless-stopped
    # The server drains in-flight requests on SIGTERM (a PDF render takes
    # seconds); give it room to finish before Docker resorts to SIGKILL.
    stop_grace_period: 30s
    ports:
      # Loopback by default. Set KUNDALI_BIND=0.0.0.0 to reach it from other
      # devices - there is no authentication, so mean it when you do.
      - "${KUNDALI_BIND:-127.0.0.1}:${KUNDALI_PORT:-8777}:8777"
    volumes:
      - kundali-data:/data
    environment:
      - TZ=UTC          # only affects log timestamps; chart timezones are per-record
      # The city search index. Empty means the built-in default; set
      # KUNDALI_GEOCODER=off in .env for an install that must never reach
      # the internet (the GUI then hides the search box).
      - KUNDALI_GEOCODER=${KUNDALI_GEOCODER:-}
    # Hardening, matching the systemd unit in deploy/.
    read_only: true     # the rootfs is immutable; /data and /tmp are the exceptions
    tmpfs:
      - /tmp:size=256m,mode=1777   # scratch space while a PDF renders
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  kundali-data:
